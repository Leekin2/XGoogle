def contextualTestClasses = layout.buildDirectory.dir('contextual-tests')
tasks.register('compileContextualSearchTest', JavaCompile) {
    dependsOn 'compileReleaseKotlin'
    source files('../tests/ContextualSearchTest.java') + fileTree('../tests/contextual-stubs') { include '**/*.java' }
    classpath = files()
    destinationDirectory = contextualTestClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}
tasks.register('testContextualSearch', JavaExec) {
    dependsOn 'compileContextualSearchTest'
    classpath = files(contextualTestClasses, layout.buildDirectory.dir('intermediates/built_in_kotlinc/release/compileReleaseKotlin/classes')) +
        files({ configurations.releaseRuntimeClasspath.findAll { it.name.startsWith('kotlin-stdlib-') && it.name.endsWith('.jar') } }) +
        files({ zipTree(configurations.releaseCompileClasspath.find { it.name == 'api-102.0.0.aar' })
            .matching { include 'classes.jar' }.singleFile })
    mainClass = 'io.github.leekin2.xgoogle.ContextualSearchTest'
}

def hotwordTestClasses = layout.buildDirectory.dir('hotword-tests')

def lifecycleTestClasses = layout.buildDirectory.dir('hook-lifecycle-tests')
tasks.register('compileHookLifecycleTests', JavaCompile) {
    dependsOn 'compileReleaseJavaWithJavac'
    source files('../tests/SignalModelHookLifecycleTest.java', '../tests/RoleReconciliationTest.java', '../tests/HookInstallRollbackTest.java', '../tests/HiddenCircleNoAssistantTest.java', '../tests/FeatureQueryTest.java', '../tests/ContextBindingCacheTest.java') +
        fileTree('../tests/lifecycle-stubs') { include '**/*.java' } +
        fileTree('../tests/contextual-stubs') { include 'android/**/*.java' }
    classpath = files(layout.buildDirectory.dir('intermediates/built_in_kotlinc/release/compileReleaseKotlin/classes'),
        layout.buildDirectory.dir('intermediates/javac/release/compileReleaseJavaWithJavac/classes')) +
        files(androidComponents.sdkComponents.bootClasspath) +
        files({ configurations.releaseRuntimeClasspath.findAll { it.name.startsWith('kotlin-stdlib-') && it.name.endsWith('.jar') } }) +
        files({ zipTree(configurations.releaseCompileClasspath.find { it.name == 'api-102.0.0.aar' })
            .matching { include 'classes.jar' }.singleFile })
    destinationDirectory = lifecycleTestClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}
['SignalModelHookLifecycleTest', 'RoleReconciliationTest', 'HookInstallRollbackTest', 'HiddenCircleNoAssistantTest', 'FeatureQueryTest', 'ContextBindingCacheTest'].each { testName ->
    tasks.register("test${testName}", JavaExec) {
        dependsOn 'compileHookLifecycleTests'
        classpath = files(lifecycleTestClasses) + tasks.named('compileHookLifecycleTests').get().classpath
        mainClass = "io.github.leekin2.xgoogle.${testName}"
    }
}
tasks.register('testHookLifecycle') {
    dependsOn 'testSignalModelHookLifecycleTest', 'testRoleReconciliationTest', 'testHookInstallRollbackTest', 'testHiddenCircleNoAssistantTest', 'testFeatureQueryTest', 'testContextBindingCacheTest'
}
tasks.register('compileHotwordUidTest', JavaCompile) {
    source files('../tests/HotwordUidTest.java') + fileTree('../tests/hotword-stubs') { include '**/*.java' }
    classpath = files()
    destinationDirectory = hotwordTestClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}
tasks.register('testHotwordUid', JavaExec) {
    dependsOn 'compileReleaseKotlin', 'compileHotwordUidTest'
    classpath = files(hotwordTestClasses, layout.buildDirectory.dir('intermediates/built_in_kotlinc/release/compileReleaseKotlin/classes')) +
        files({ configurations.releaseRuntimeClasspath.findAll { it.name.startsWith('kotlin-stdlib-') && it.name.endsWith('.jar') } }) +
        files({ zipTree(configurations.releaseCompileClasspath.find { it.name == 'api-102.0.0.aar' })
            .matching { include 'classes.jar' }.singleFile })
    mainClass = 'io.github.leekin2.xgoogle.HotwordUidTest'
}

