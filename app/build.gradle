plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.plugin.compose'
}
android {
    namespace 'io.github.leekin2.xgoogle'
    compileSdk { version = release(37) }
    buildToolsVersion '36.0.0'
    defaultConfig {
        // XGoogle's own application id in LSPosed's repository.
        applicationId 'io.github.leekin2.xgoogle'
        minSdk 35
        targetSdk 36
        versionCode 139
        versionName '1.3.9'
        ndk { abiFilters 'arm64-v8a' }
    }
    buildTypes {
        release { signingConfig signingConfigs.debug; minifyEnabled true; shrinkResources true; proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro' }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { compose true; buildConfig true }
    packaging { resources { excludes += ['META-INF/LICENSE*','META-INF/NOTICE*','META-INF/AL2.0','META-INF/LGPL2.1'] } }
}
dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'
    implementation 'io.github.libxposed:interface:102.0.0'
    implementation platform('androidx.compose:compose-bom:2026.09.00')
    implementation 'androidx.activity:activity-compose:1.12.3'
    implementation 'androidx.compose.ui:ui'
    // HyperOS-style Compose components (Apache-2.0).
    implementation 'androidx.compose.material3:material3:1.5.0-alpha28'
    implementation 'top.yukonga.miuix.kmp:miuix-ui:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-preference:0.9.4'
    implementation 'top.yukonga.miuix.kmp:miuix-blur:0.9.4'
    implementation 'androidx.compose.material:material-icons-extended:1.7.8'
    implementation 'androidx.core:core-ktx:1.17.0'
    // Locates obfuscated Google and Wallet code (live translate, Lens, Wallet preview; Apache-2.0).
    implementation 'org.luckypray:dexkit:2.3.0'
}

def googleRestoreTestClasses = layout.buildDirectory.dir('google-restore-tests')
tasks.register('compileGoogleRestoreAccessTest', JavaCompile) {
    source files('src/main/java/io/github/leekin2/xgoogle/GoogleRestoreAccess.java',
        '../tests/GoogleRestoreAccessTest.java')
    classpath = files()
    destinationDirectory = googleRestoreTestClasses
    sourceCompatibility = '17'
    targetCompatibility = '17'
    options.encoding = 'UTF-8'
}
tasks.register('testGoogleRestoreAccess', JavaExec) {
    dependsOn 'compileGoogleRestoreAccessTest'
    classpath = files(googleRestoreTestClasses)
    mainClass = 'io.github.leekin2.xgoogle.GoogleRestoreAccessTest'
}

